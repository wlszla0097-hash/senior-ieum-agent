# Render Blueprint — 대시보드에서 New → Blueprint 로 이 저장소를 고르면 아래 설정이 자동 입력된다.
services:
  - type: web
    name: senior-ieum-agent
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AI_MODEL
        value: gpt-5-mini          # 교육장 게이트웨이 사용 가능 모델 (gpt-5.4-mini 도 가능)
      - key: OPENAI_BASE_URL
        value: https://copa.codyssey.kr/v1   # 교육장 OpenAI 호환 게이트웨이. 개인 OpenAI 키면 이 줄 삭제
